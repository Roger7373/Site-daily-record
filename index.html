<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="工地工人日勤、OT、预支薪水和月尾薪资">
<title>Site Daily Record</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
  padding-bottom:75px;
}

header{
  background:#111827;
  color:white;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:21px;
}

header p{
  margin:5px 0 0;
  color:#d1d5db;
  font-size:13px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card h2{
  margin:0 0 12px;
  font-size:18px;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-size:14px;
  cursor:pointer;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-green{
  background:#16a34a;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

.btn-gray{
  background:#e5e7eb;
  color:#111827;
}

.btn-orange{
  background:#ea580c;
  color:white;
}

input,
select{
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
  margin-top:5px;
}

label{
  display:block;
  margin-bottom:12px;
  font-size:14px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

.stat{
  background:#f9fafb;
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.stat-title{
  color:#6b7280;
  font-size:12px;
}

.stat-value{
  font-size:20px;
  font-weight:bold;
  margin-top:4px;
}

.worker{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}

.worker-name{
  font-size:17px;
  font-weight:bold;
}

.worker-info{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}

.worker-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
  flex-wrap:wrap;
}
